syntax = 'proto3';
package Common.V1;

// Generic key/value pair, reusable across any request/response message.
message KeyValuePair {
  string key = 1;
  string value = 2;
}

message ResourceId {
  string resourceType = 1;
  string namespace = 2;
  string name = 3;
}

message ResourceToken {
  ResourceId resourceId = 1;
  string sas = 2;
}
